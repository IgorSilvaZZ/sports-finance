  responsible-service:
    image: responsible-service
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db-responsible
    environment:
      TZ: America/Sao_Paulo
      SPRING.APPLICATION.NAME: responsible-service
      SPRING.DATASOURCE.URL: jdbc:mysql://db-responsible:3308/responsible_service?useSSL=false&use&serverTimezone=UTC&enabledTLSProtocols=TLSv1.2
      SPRING.DATASOURCE.USERNAME: dev
      SPRING.DATASOURCE.PASSWORD: admin123
    networks:
      - sports-finance-network

  event-service:
    image: event-service
    restart: always
    ports:
      - "8100:8100"
    depends_on:
      - db-event
    environment:
      TZ: America/Sao_Paulo
      SPRING.APPLICATION.NAME: event-service
      SPRING.DATASOURCE.URL: jdbc:mysql://db-event:3310/event_service?useSSL=false&use&serverTimezone=UTC&enabledTLSProtocols=TLSv1.2
      SPRING.DATASOURCE.USERNAME: dev
      SPRING.DATASOURCE.PASSWORD: admin123
    networks:
      - sports-finance-network
